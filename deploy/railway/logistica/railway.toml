[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/logistica/Dockerfile"
watchPatterns = ["services/logistica-service/**", "deploy/railway/logistica/**"]

[deploy]
healthcheckPath = "/api/v1/logistica/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
