# Configuracion de Logistica Service - GlassFlow
server.port=8082
spring.application.name=glassflow-logistica-service

# Conexion a PostgreSQL + PostGIS (glassflow_logistica_db)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${LOGISTICA_DB_NAME:glassflow_logistica_db}
spring.datasource.username=${DB_USER:glassflow_admin}
spring.datasource.password=${DB_PASSWORD:glassflow_secure_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# Google Maps API Key inyectada desde entorno
glassflow.google.maps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyDYqJ2TbM6UD5GIHt6wTDRrhpzdQx2QsmQ}

# Seguridad JWT para validacion de cabeceras en endpoints protegidos
glassflow.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9nbGFzc2Zsb3dfMjAyNl9qd3Rfc2lnbmF0dXJlX2htYWM=}
