name: capstone-inventario
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-inventario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  usuarios:
    build: services/usuarios-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventario}
      DB_USER: ${POSTGRES_USER:-inventario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      MASTER_IDENTIFICATION: ${MASTER_IDENTIFICATION:?Configura MASTER_IDENTIFICATION}
      MASTER_NAME: ${MASTER_NAME:-Administrador principal}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Configura MASTER_PASSWORD}
    ports:
      - "127.0.0.1:${USUARIOS_PORT:-8091}:8081"
    depends_on:
      postgres:
        condition: service_healthy
  inventario:
    build: services/inventario-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventario}
      DB_USER: ${POSTGRES_USER:-inventario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      AUTH_URL: http://usuarios:8081
    ports:
      - "127.0.0.1:${INVENTARIO_PORT:-8092}:8082"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
