spring.application.name=retazos-service
server.port=8084
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alumvid_db}}
spring.datasource.username=${DB_USER:alumvid_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.schemas=retazos
spring.flyway.default-schema=retazos
app.auth-url=${AUTH_URL:http://localhost:8081}
server.error.include-message=never
management.endpoints.web.exposure.include=health
