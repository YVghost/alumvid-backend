# Configuracion de Logistica Service - AlumVid
server.port=8083
spring.application.name=logistica-service

# Conexion a PostgreSQL + PostGIS (alumvid_db, esquema logistica)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alumvid_db}
spring.datasource.username=${DB_USER:alumvid_admin}
spring.datasource.password=${DB_PASSWORD:alumvid_secure_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate Spatial / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.default_schema=logistica

# Google Maps API Platform (Restringida en consola Google Cloud)
alumvid.google.maps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyDYqJ2TbM6UD5GIHt6wTDRrhpzdQx2QsmQ}

# Seguridad JWT para validacion de cabeceras en endpoints protegidos
alumvid.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}
