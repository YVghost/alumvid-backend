# Configuracion de Logistica Service - AlumVid
server.port=${PORT:8083}
spring.application.name=logistica-service

# Conexion a PostgreSQL + PostGIS (alumvid_db, esquema logistica)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5433}}/${DB_NAME:${PGDATABASE:alumvid_db}}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USER:${PGUSER:alumvid_admin}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate Spatial / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=logistica

# Google Maps API Platform (Restringida en consola Google Cloud)
alumvid.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Seguridad JWT para validacion de cabeceras en endpoints protegidos
alumvid.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}

# Railway y proxies HTTPS; los valores locales se conservan por defecto.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_TIMEOUT:60000}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
