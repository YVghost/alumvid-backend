# Configuracion de API Gateway - AlumVid
server.port=8080
spring.application.name=gateway-service

# Ruteo hacia Usuarios & Auth Service (puerto 8081)
spring.cloud.gateway.mvc.routes[0].id=usuarios-service-auth
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=usuarios-service-admin
spring.cloud.gateway.mvc.routes[1].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/admin/**,/api/admin/**,/api/choferes/**

# Ruteo hacia Inventario Service (puerto 8082)
spring.cloud.gateway.mvc.routes[2].id=inventario-service
spring.cloud.gateway.mvc.routes[2].uri=${INVENTARIO_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/products/**,/api/inventario/**

# Ruteo hacia Logistica Service (puerto 8083)
spring.cloud.gateway.mvc.routes[3].id=logistica-service
spring.cloud.gateway.mvc.routes[3].uri=${LOGISTICA_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/logistica/**,/api/logistica/**,/ws-telemetria/**,/ws-logistica/**

# Servidor de recursos estaticos para el panel web del administrador
spring.web.resources.static-locations=file:admin-dashboard/,classpath:/static/
