spring.application.name=alumvid-backend-unificado
app.unified=true
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
server.tomcat.threads.max=${HTTP_THREADS:16}
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alumvid_db}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USER:alumvid_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=60000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/modules/usuarios
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=logistica
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
app.master.identification=${MASTER_IDENTIFICATION}
app.master.name=${MASTER_NAME:Administrador principal}
app.master.password=${MASTER_PASSWORD}
alumvid.security.jwt.secret=${JWT_SECRET}
alumvid.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
alumvid.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.auth-url=http://unused.invalid
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jmx.enabled=false
spring.main.banner-mode=off
