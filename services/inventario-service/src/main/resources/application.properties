spring.application.name=inventario-service
server.port=8082

# Base de datos PostgreSQL / PostGIS compartida
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alumvid_db}}
spring.datasource.username=${DB_USER:alumvid_admin}
spring.datasource.password=${DB_PASSWORD:alumvid_secure_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000

# Flyway Schema 'inventario'
spring.flyway.enabled=true
spring.flyway.schemas=inventario
spring.flyway.default-schema=inventario

# Comunicacion interna con el microservicio de usuarios (puerto 8081)
app.auth-url=${AUTH_URL:http://localhost:8081}

server.error.include-message=always
management.endpoints.web.exposure.include=health
