spring.application.name=usuarios-service
server.port=8081

# Base de datos PostgreSQL / PostGIS compartida
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:alumvid_db}}
spring.datasource.username=${DB_USER:alumvid_admin}
spring.datasource.password=${DB_PASSWORD:alumvid_secure_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000

# Flyway Schema 'usuarios'
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios

server.error.include-message=always

# Administrador principal del sistema (Master Bootstrap)
app.master.identification=${MASTER_IDENTIFICATION:1700000000}
app.master.name=${MASTER_NAME:Administrador General AlumVid}
app.master.password=${MASTER_PASSWORD:AlumVidAdmin2026!}

# Seguridad JWT (AlumVid)
alumvid.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}
alumvid.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Rate Limiting
alumvid.security.rate-limit.capacity=15
alumvid.security.rate-limit.tokens-per-minute=15
