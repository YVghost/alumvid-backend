spring.application.name=usuarios-service
server.port=${PORT:8081}

# Base de datos PostgreSQL / PostGIS compartida
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5433}}/${DB_NAME:${PGDATABASE:alumvid_db}}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USER:${PGUSER:alumvid_admin}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000

# Flyway Schema 'usuarios'
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios

server.error.include-message=always

# Administrador principal del sistema (Master Bootstrap)
app.master.identification=${MASTER_IDENTIFICATION:1700000000}
app.master.name=${MASTER_NAME:Administrador General AlumVid}
app.master.password=${MASTER_PASSWORD:AlumVidAdmin2026!}

# Seguridad JWT (AlumVid)
alumvid.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}
alumvid.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Rate Limiting
alumvid.security.rate-limit.capacity=15
alumvid.security.rate-limit.tokens-per-minute=15

# Railway y proxies HTTPS; los valores locales se conservan por defecto.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_TIMEOUT:60000}
