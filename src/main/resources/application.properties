spring.application.name=glass-inventory-api
server.port=8080

# Configuracion de conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tita_vidrios
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate con soporte espacial PostGIS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
