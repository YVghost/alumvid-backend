spring.application.name=glassflow-logistics-api
server.port=8080

# Configuracion de conexion a PostgreSQL + PostGIS (Docker GlassFlow)
spring.datasource.url=jdbc:postgresql://localhost:5433/glassflow_db
spring.datasource.username=glassflow_admin
spring.datasource.password=glassflow_secure_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate con soporte espacial PostGIS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
