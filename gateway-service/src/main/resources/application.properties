# Configuracion de API Gateway - GlassFlow
server.port=8080
spring.application.name=glassflow-gateway-service

# Ruteo hacia Auth Service (puerto 8081)
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/auth/**

# Ruteo hacia Logistica Service (puerto 8082)
spring.cloud.gateway.mvc.routes[1].id=logistica-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/logistica/**

# Servidor de recursos estaticos para el panel web del administrador
spring.web.resources.static-locations=file:admin-dashboard/,classpath:/static/

