# Configuracion de Auth Service - GlassFlow
server.port=8081
spring.application.name=glassflow-auth-service

# Conexion a PostgreSQL (glassflow_auth_db)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${AUTH_DB_NAME:glassflow_auth_db}
spring.datasource.username=${DB_USER:glassflow_admin}
spring.datasource.password=${DB_PASSWORD:glassflow_secure_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad JWT
glassflow.security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9nbGFzc2Zsb3dfMjAyNl9qd3Rfc2lnbmF0dXJlX2htYWM=}
glassflow.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Limite de peticiones (Rate Limiting)
glassflow.security.rate-limit.capacity=10
glassflow.security.rate-limit.tokens-per-minute=10
