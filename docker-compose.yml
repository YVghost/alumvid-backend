name: alumvid-platform

services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: alumvid-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-alumvid_db}
      POSTGRES_USER: ${DB_USER:-alumvid_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alumvid_secure_2026}
    ports:
      - "5433:5432"
    volumes:
      - alumvid_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  usuarios-service:
    build:
      context: ./services/usuarios-service
    container_name: alumvid-usuarios
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:-alumvid_secure_2026}
      MASTER_IDENTIFICATION: ${MASTER_IDENTIFICATION:-1700000000}
      MASTER_NAME: ${MASTER_NAME:-Administrador General AlumVid}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-AlumVidAdmin2026!}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_SECRET: ${JWT_SECRET:-c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}
    ports:
      - "${USUARIOS_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      postgres-postgis:
        condition: service_healthy

  inventario-service:
    build:
      context: ./services/inventario-service
    container_name: alumvid-inventario
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:-alumvid_secure_2026}
      AUTH_URL: http://usuarios-service:8081
    ports:
      - "${INVENTARIO_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      postgres-postgis:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy

  logistica-service:
    build:
      context: ./services/logistica-service
    container_name: alumvid-logistica
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:-alumvid_secure_2026}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_SECRET: ${JWT_SECRET:-c3VwZXJfc2VjcmV0X2tleV9hbHVtdmlkXzIwMjZfand0X3NpZ25hdHVyZV9obWFj=}
    ports:
      - "${LOGISTICA_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres-postgis:
        condition: service_healthy

  retazos-service:
    build:
      context: ./services/retazos-service
    container_name: alumvid-retazos
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      AUTH_URL: http://usuarios-service:8081
    ports:
      - "127.0.0.1:${RETAZOS_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      postgres-postgis:
        condition: service_healthy
      inventario-service:
        condition: service_healthy

  pedidos-service:
    build:
      context: ./services/pedidos-service
    container_name: alumvid-pedidos
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      AUTH_URL: http://usuarios-service:8081
    ports:
      - "127.0.0.1:${PEDIDOS_SERVICE_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      retazos-service:
        condition: service_healthy

  ubicaciones-service:
    build:
      context: ./services/ubicaciones-service
    container_name: alumvid-ubicaciones
    restart: on-failure
    environment:
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alumvid_db}
      DB_USER: ${DB_USER:-alumvid_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      AUTH_URL: http://usuarios-service:8081
    ports:
      - "127.0.0.1:${UBICACIONES_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      pedidos-service:
        condition: service_healthy

  gateway-service:
    build:
      context: ./services/gateway-service
    container_name: alumvid-gateway
    restart: on-failure
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AUTH_SERVICE_URL: http://usuarios-service:8081
      INVENTARIO_SERVICE_URL: http://inventario-service:8082
      UBICACIONES_SERVICE_URL: http://ubicaciones-service:8086
      PEDIDOS_SERVICE_URL: http://pedidos-service:8085
      RETAZOS_SERVICE_URL: http://retazos-service:8084
      LOGISTICA_SERVICE_URL: http://logistica-service:8083
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/platform-info"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      usuarios-service:
        condition: service_healthy
      inventario-service:
        condition: service_healthy
      logistica-service:
        condition: service_started

volumes:
  alumvid_pg_data:
    name: alumvid_pg_data
